schema_version: "0.1"

scene:
  id: tube_with_implicit_objects
  description: Target tube with independent sphere inclusion and ellipsoid environment objects.

grid:
  shape: [40, 40, 40]
  spacing: [1.0, 1.0, 1.0]

composition:
  label_mode: priority
  scalar_blend: overwrite
  overlap_policy: allow

mask_rules:
  target_roles: [target]
  analysis_roles: [target, analysis_support]

render:
  chunk_size: 32768

objects:
  - id: target
    kind: tube
    role: target
    label: 1
    priority: 10
    map_name: fa_like
    curve:
      kind: line
      start_mm: [8.0, 20.0, 20.0]
      end_mm: [32.0, 20.0, 20.0]
      step_mm: 1.0
    cross_section:
      kind: circle
      radius_mm: 3.0
    profile:
      kind: linear_radial
      centre_value: 1.0
      edge_value: 0.2
      background_value: 0.0

  - id: sphere_inclusion
    kind: sphere
    role: inclusion
    label: 2
    priority: 20
    map_name: qsm_like
    centre_mm: [20.0, 27.0, 20.0]
    radius_mm: 3.0
    profile:
      kind: constant
      value: 2.0
      background_value: 0.0

  - id: ellipsoid_environment
    kind: ellipsoid
    role: environment
    label: 3
    priority: 1
    map_name: wm_pve_like
    centre_mm: [20.0, 12.0, 20.0]
    radii_mm: [6.0, 2.0, 3.0]
    profile:
      kind: constant
      value: 0.5
      background_value: 0.0
