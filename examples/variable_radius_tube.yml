schema_version: "0.1"

scene:
  id: variable_radius_tube
  description: Straight tube with a linearly widening circular cross-section.

grid:
  shape: [36, 36, 36]
  spacing: [1.0, 1.0, 1.0]

composition:
  label_mode: priority
  scalar_blend: overwrite
  overlap_policy: allow

objects:
  - id: target
    kind: tube
    role: target
    label: 1
    priority: 10
    map_name: fa_like
    curve:
      kind: line
      start_mm: [8.0, 18.0, 18.0]
      end_mm: [28.0, 18.0, 18.0]
      step_mm: 1.0
    cross_section:
      kind: variable_circle_linear
      radius_start_mm: 1.0
      radius_end_mm: 4.0
    profile:
      kind: linear_radial
      centre_value: 1.0
      edge_value: 0.2
      background_value: 0.0
