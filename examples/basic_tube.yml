schema_version: "0.1"

scene:
  id: basic_tube
  description: Straight circular tube with a linear radial scalar profile.

grid:
  shape: [32, 32, 32]
  spacing: [1.0, 1.0, 1.0]

composition:
  label_mode: priority
  scalar_blend: overwrite
  overlap_policy: allow

objects:
  - id: target
    kind: tube
    role: target
    label: 1
    priority: 10
    map_name: fa_like
    curve:
      kind: line
      start_mm: [8.0, 16.0, 16.0]
      end_mm: [24.0, 16.0, 16.0]
      step_mm: 1.0
    cross_section:
      kind: circle
      radius_mm: 3.0
    profile:
      kind: linear_radial
      centre_value: 1.0
      edge_value: 0.2
      background_value: 0.0
