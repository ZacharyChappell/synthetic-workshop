[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "synthetic-workshop"
version = "0.1.0a1"
description = "Analytic synthetic scene generation for image-method validation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Zachary Chappell" }
]
keywords = [
    "synthetic-data",
    "image-analysis",
    "phantoms",
    "validation",
    "neuroimaging",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]
io = [
    "nibabel>=5.0",
    "PyYAML>=6.0",
]
plot = [
    "matplotlib>=3.8",
]
all = [
    "nibabel>=5.0",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

gui = ["streamlit>=1.35"]

[project.scripts]
synthworkshop = "synthworkshop.cli:main"

[project.urls]
Repository = "https://github.com/ZacharyChappell/synthetic-workshop"

[tool.hatch.build.targets.wheel]
packages = ["src/synthworkshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
